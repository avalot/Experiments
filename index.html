<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roadway — 3D street page editor</title>
<link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <!-- The shared runtime paints the scene here (same code the export uses). -->
  <div id="stage" class="stage"></div>

  <!-- Editor chrome (hidden in preview mode). -->
  <header id="toolbar" class="toolbar"></header>
  <aside id="inspector" class="inspector"></aside>
  <div id="hint" class="edit-hint">Edit mode · click to select · drag to move · Shift-drag = depth · arrows nudge</div>

  <input id="fileInput" type="file" accept="application/json,.json" hidden />

  <script type="module" src="./src/editor/editor.js"></script>
</body>
</html>
